services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loancompare
      POSTGRES_USER: loancompare
      POSTGRES_PASSWORD: loancompare
    ports:
      - "5432:5432"
    volumes:
      - loancompare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loancompare -d loancompare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://loancompare:loancompare@db:5432/loancompare?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  loancompare_pg:
